name: eve-industry-planner

# Extension fields for reusable configurations
x-common-dns: &common-dns
  - 8.8.8.8
  - 8.8.4.4
  - 1.1.1.1

x-common-depends-on: &common-depends-on
  mongo:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_started

# OTLP apps dial otel-collector:4317; without this they can start first and log connection refused / export timeouts until the collector listens.
x-common-depends-on-otel: &common-depends-on-otel
  mongo:
    condition: service_healthy
  redis:
    condition: service_healthy
  nats:
    condition: service_started
  otel-collector:
    condition: service_started

x-common-service-config: &common-service-config
  restart: unless-stopped
  env_file: [.env]
  networks:
    - eip
  dns: *common-dns
  depends_on: *common-depends-on

services:
  api:
    <<: *common-service-config
    environment:
      OTEL_SERVICE_NAME: api
      DEPLOYMENT_ENVIRONMENT: ${ENVIRONMENT:-}
    image: ghcr.io/darcy561/eve-industry-planner-api:Public-latest
    deploy:
      replicas: 1
    depends_on:
      <<: *common-depends-on
      core:
        condition: service_healthy
      otel-collector:
        condition: service_started
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # API Router & Service (HTTP)
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.routers.api.middlewares=cors"
      # API Router (HTTPS)
      - "traefik.http.routers.api-secure.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api-secure.entrypoints=websecure"
      - "traefik.http.routers.api-secure.service=api"
      - "traefik.http.routers.api-secure.middlewares=cors"
      # CORS Middleware
      - "traefik.http.middlewares.cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS"
      - "traefik.http.middlewares.cors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With,Accept,Origin"
      - "traefik.http.middlewares.cors.headers.accessControlAllowOriginListRegex=^https://eveindustryplanner.com$$"
      - "traefik.http.middlewares.cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.cors.headers.accessControlMaxAge=86400"
      - "traefik.http.middlewares.cors.headers.addVaryHeader=true"
      # API Service Load Balancer
      - "traefik.http.services.api.loadbalancer.server.port=4000"
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=3s"
      - "traefik.http.services.api.loadbalancer.healthcheck.scheme=http"
    volumes:
      - api_data:/data
      - static_data_files:/static-data
      - ./adminSDK.json:/app/adminSDK.json:ro

  websocket:
    <<: *common-service-config
    environment:
      OTEL_SERVICE_NAME: websocket
      DEPLOYMENT_ENVIRONMENT: ${ENVIRONMENT:-}
    image: ghcr.io/darcy561/eve-industry-planner-websocket:Public-latest
    build:
      context: ./services
      dockerfile: websocket/Dockerfile
    depends_on:
      <<: *common-depends-on
      core:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      replicas: 0
    labels:
      # WebSocket Router & Service (HTTP)
      - "traefik.enable=true"
      - "traefik.http.routers.ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.ws.entrypoints=web"
      - "traefik.http.routers.ws.service=ws"
      - "traefik.http.routers.ws.middlewares=cors"
      # WebSocket Router (HTTPS)
      - "traefik.http.routers.ws-secure.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.ws-secure.entrypoints=websecure"
      - "traefik.http.routers.ws-secure.service=ws"
      - "traefik.http.routers.ws-secure.middlewares=cors"
      # WebSocket service load balancer (internal port inside the container)
      - "traefik.http.services.ws.loadbalancer.server.port=4001"
    volumes:
      # Share JWT key material with API (both use /data/*jwt*.pem and /data/jwt-key-id.txt)
      - api_data:/data

  worker:
    <<: *common-service-config
    depends_on: *common-depends-on-otel
    environment:
      OTEL_SERVICE_NAME: worker
      DEPLOYMENT_ENVIRONMENT: ${ENVIRONMENT:-}
    image: ghcr.io/darcy561/eve-industry-planner-worker:Public-latest
    deploy:
      replicas: 1
    volumes:
      - worker_data:/data
      - static_data_files:/static-data
      - ./adminSDK.json:/app/adminSDK.json:ro

  core:
    <<: *common-service-config
    depends_on: *common-depends-on-otel
    environment:
      OTEL_SERVICE_NAME: core
      DEPLOYMENT_ENVIRONMENT: ${ENVIRONMENT:-}
    container_name: core
    image: ghcr.io/darcy561/eve-industry-planner-core:Public-latest
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/core-ready"]
      interval: 5s
      timeout: 3s
      retries: 180
      start_period: 10s
    volumes:
      - core_data:/data
      - static_data_files:/static-data

  frontend:
    <<: *common-service-config
    container_name: frontend
    image: ghcr.io/darcy561/eve-industry-planner-frontend:Public-latest
    depends_on:
      <<: *common-depends-on
      core:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:80/health.json',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      # Frontend Router & Service
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.service=frontend"
      # Frontend Service Load Balancer
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.path=/health.json"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.timeout=3s"
      - "traefik.http.services.frontend.loadbalancer.healthcheck.scheme=http"
      # Frontend Router Rule (HTTP)
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.middlewares=frontend-contenttype,security-headers"
      # Frontend Router (HTTPS)
      - "traefik.http.routers.frontend-secure.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend-secure.priority=1"
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.service=frontend"
      - "traefik.http.routers.frontend-secure.middlewares=frontend-contenttype,security-headers"
      - "traefik.http.middlewares.frontend-contenttype.contentType=true"
      # Security Headers Middleware
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.isDevelopment=false"

  traefik:
    <<: *common-service-config
    container_name: traefik
    image: traefik:v3.6.6
    command:
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.dashboard.address=:81"
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      # Access Log
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--log.level=INFO"
      - "--log.filepath=/var/log/traefik/traefik.log"
      # OpenTelemetry
      - "--tracing=true"
      - "--tracing.otlp=true"
      - "--tracing.otlp.grpc=true"
      - "--tracing.otlp.grpc.endpoint=otel-collector:4317"
      - "--tracing.otlp.grpc.insecure=true"
      - "--tracing.servicename=traefik"
    labels:
      # Enable Traefik
      - "traefik.enable=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_data:/data"
      - "/var/log/traefik:/var/log/traefik"

  nats:
    container_name: nats
    image: nats:2.12.3
    restart: unless-stopped
    volumes:
      - nats_data:/data
    command: ["-js", "-sd", "/data", "-m", "8222"]
    networks:
      - eip

  asynqmon:
    <<: *common-service-config
    container_name: asynqmon
    image: hibiken/asynqmon
    ports:
      - "10.8.0.1:8080:8080"
    command:
      - "--redis-addr=redis:6379"
      - "--redis-password=${REDIS_PASSWORD}"
      - "--enable-metrics-exporter"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    container_name: redisDB
    image: redis:8.4.0
    restart: unless-stopped
    env_file: [.env]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli -a "${REDIS_PASSWORD}" ping
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "10.8.0.1:6379:6379"
    networks:
      - eip

  mongo:
    container_name: mongoDB
    image: mongo:8.2
    restart: unless-stopped
    env_file: [.env]
    environment:
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-setup.sh:/mongo-setup.sh:ro
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    command: ["bash", "/mongo-setup.sh", "--bind_ip_all"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$MONGO_ROOT_USERNAME\" -p \"$MONGO_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    ports:
      - "10.8.0.1:27017:27017"
    networks:
      - eip

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - eip
    dns: *common-dns
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started
      asynqmon:
        condition: service_started

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      - eip
    dns: *common-dns
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - loki_data:/loki
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    networks:
      - eip
    dns: *common-dns
    environment:
      DOCKER_API_VERSION: "1.44"
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail/config.yaml:/etc/promtail/config.yaml:ro
    depends_on:
      loki:
        condition: service_started

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    container_name: jaeger
    restart: unless-stopped
    networks:
      - eip
    dns: *common-dns
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "10.8.0.1:16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    networks:
      - eip
    dns: *common-dns
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - eip
    dns: *common-dns
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://10.8.0.1:3030
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "10.8.0.1:3030:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      jaeger:
        condition: service_started

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - eip
    dns: *common-dns
    pid: host
    command:
      - --path.rootfs=/host
      - --no-collector.kernel_hung
    volumes:
      - /:/host:ro

volumes:
  mongo_data:
  redis_data:
  nats_data:
  api_data:
  traefik_data:
  worker_data:
  core_data:
  static_data_files:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  eip:
    driver: bridge
