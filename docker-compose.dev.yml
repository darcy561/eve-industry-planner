services:
  # Dev builds use explicit manual versions.
  # Docker Compose does not natively import values from VERSION.json.
  api:
    image: eve-industry-planner-api:local
    build:
      context: ./services
      dockerfile: api/Dockerfile
      args:
        APP_VERSION: 0.8.11
        FRONTEND_APP_VERSION: 0.8.11
        APP_FEATURE_FLAGS_JSON: '{"enable_upcoming_changes_page":false}'
        # Same pattern as CI: bake from repo-root .env (Compose interpolates ${VAR} from .env).
        ENVIRONMENT: ${ENVIRONMENT:-development}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
        FEEDBACK_DISCORD_WEBHOOK_URL: ${FEEDBACK_DISCORD_WEBHOOK_URL:-}
    env_file: [.env]
    environment:
      FAIL_ON_STARTUP: "false"

  websocket:
    image: eve-industry-planner-websocket:local
    build:
      context: ./services
      dockerfile: websocket/Dockerfile
      args:
        APP_VERSION: 0.8.11
        ENVIRONMENT: ${ENVIRONMENT:-development}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    env_file: [.env]
    environment:
      FAIL_ON_STARTUP: "false"

  worker:
    image: eve-industry-planner-worker:local
    build:
      context: ./services
      dockerfile: worker/Dockerfile
      args:
        APP_VERSION: 0.8.11
        ENVIRONMENT: ${ENVIRONMENT:-development}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    env_file: [.env]


  core:
    image: eve-industry-planner-core:local
    build:
      context: ./services
      dockerfile: core/Dockerfile
      args:
        APP_VERSION: 0.8.11
        FRONTEND_APP_VERSION: 0.8.11
        APP_FEATURE_FLAGS_JSON: '{"enable_upcoming_changes_page":false}'
        ENVIRONMENT: ${ENVIRONMENT:-development}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    env_file: [.env]

  mongo:
    ports: !override
      - "27017:27017"

  redis:
    ports: !override
      - "6379:6379"

  asynqmon:
    ports: !override
      - "8080:8080"

  # Observability: host 3030 -> Grafana 3000. Use http://127.0.0.1:3030 — 'localhost' often resolves to IPv6 (::1) first while this bind is IPv4-only.
  grafana:
    ports: !override
      - "3030:3000"
    environment: !override
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://127.0.0.1:3030
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=5s

  frontend:
    image: eve-industry-planner-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
        FRONTEND_APP_VERSION: 0.8.11
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT_ID: ${SENTRY_PROJECT_ID:-}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
        SENTRY_ERROR_SAMPLE_RATE: ${SENTRY_ERROR_SAMPLE_RATE:-}
    env_file: [.env]
