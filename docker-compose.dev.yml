services:
  api:
    image: eve-industry-planner-api:local
    build:
      context: ./services
      dockerfile: api/Dockerfile
    env_file: [.env]
    environment:
      FAIL_ON_STARTUP: "false"

  websocket:
    image: eve-industry-planner-websocket:local
    build:
      context: ./services
      dockerfile: websocket/Dockerfile
    env_file: [.env]
    environment:
      FAIL_ON_STARTUP: "false"

  worker:
    image: eve-industry-planner-worker:local
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    env_file: [.env]


  core:
    image: eve-industry-planner-core:local
    build:
      context: ./services
      dockerfile: core/Dockerfile
    env_file: [.env]

  mongo:
    ports: !override
      - "27017:27017"

  redis:
    ports: !override
      - "6379:6379"

  asynqmon:
    ports: !override
      - "8080:8080"

  # Observability: host 3030 -> Grafana 3000. Use http://127.0.0.1:3030 — 'localhost' often resolves to IPv6 (::1) first while this bind is IPv4-only.
  grafana:
    ports: !override
      - "3030:3000"
    environment: !override
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://127.0.0.1:3030
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=5s

  jaeger:
    ports: !override
      - "16686:16686"

  frontend:
    image: eve-industry-planner-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
    env_file: [.env]
