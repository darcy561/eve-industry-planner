# Dev overlay — merge with base: docker compose -f docker-compose.yml -f docker-compose.dev.yml
# (see Makefile `make dev`). Do not validate this file alone; it only overrides select services.

services:
  api:
    image: eve-industry-planner-api:local
    build:
      context: ./services
      dockerfile: api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        FRONTEND_APP_VERSION: ${APP_VERSION}
        APP_FEATURE_FLAGS_JSON: '{"enable_upcoming_changes_page":false}'
        ENVIRONMENT: ${ENVIRONMENT:-development}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
        FEEDBACK_DISCORD_WEBHOOK_URL: ${FEEDBACK_DISCORD_WEBHOOK_URL:-}
    environment:
      FAIL_ON_STARTUP: "false"

  websocket:
    image: eve-industry-planner-websocket:local
    build:
      context: ./services
      dockerfile: websocket/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        ENVIRONMENT: ${ENVIRONMENT:-development}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    environment:
      FAIL_ON_STARTUP: "false"

  worker:
    image: eve-industry-planner-worker:local
    build:
      context: ./services
      dockerfile: worker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        ENVIRONMENT: ${ENVIRONMENT:-development}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}

  core:
    image: eve-industry-planner-core:local
    build:
      context: ./services
      dockerfile: core/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}
        FRONTEND_APP_VERSION: ${APP_VERSION}
        APP_FEATURE_FLAGS_JSON: '{"enable_upcoming_changes_page":false}'
        ENVIRONMENT: ${ENVIRONMENT:-development}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}

  mongo:
    ports: !override
      - "27017:27017"

  redis:
    ports: !override
      - "6379:6379"

  asynqmon:
    ports: !override
      - "8080:8080"

  grafana:
    ports: !override
      - "127.0.0.1:3030:3000"
    environment:
      - GF_SERVER_ROOT_URL=http://127.0.0.1:3030

  frontend:
    image: eve-industry-planner-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
        FRONTEND_APP_VERSION: ${APP_VERSION}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT_ID: ${SENTRY_PROJECT_ID:-}
        SENTRY_DSN: ${SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
        SENTRY_ERROR_SAMPLE_RATE: ${SENTRY_ERROR_SAMPLE_RATE:-}
