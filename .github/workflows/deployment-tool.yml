# Deployment Tool: Public CLI ship only (workflow_dispatch).
# Requires a green test.yml run for Public tip (manual ship still), then
# re-runs Ubuntu unit + Swarm (same as test.yml) before upload.
name: deployment-tool

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump from live cli-v* (first ship is 1.0.0 if none)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: deployment-tool-public-release
  cancel-in-progress: false

jobs:
  require-ci:
    name: require green test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Public
        uses: actions/checkout@v6
        with:
          ref: Public
          fetch-depth: 0

      - name: Require successful test.yml for tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-test-green.sh "$(git rev-parse HEAD)"

  test:
    name: deployment-tool
    needs: require-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deployment-tool
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: deployment-tool/go.mod
          cache-dependency-path: deployment-tool/go.sum

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o eip-ci .

  integration:
    name: integration (swarm)
    needs: require-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deployment-tool
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: deployment-tool/go.mod
          cache-dependency-path: deployment-tool/go.sum

      - name: Docker info
        run: docker info

      - name: Swarm init
        run: |
          set -euo pipefail
          docker swarm leave --force 2>/dev/null || true
          docker swarm init

      - name: Integration tests
        run: go test ./internal/swarm/ -tags=integration -count=1 -timeout 10m

      - name: Swarm leave
        if: always()
        run: docker swarm leave --force || true

  release:
    name: release assets
    needs: [require-ci, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    defaults:
      run:
        working-directory: deployment-tool

    steps:
      - name: Checkout Public
        uses: actions/checkout@v6
        with:
          ref: Public
          fetch-depth: 0

      - name: Record Public SHA
        id: meta
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve next CLI version
        id: version
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash .github/scripts/semver-bump.sh cli "${{ github.event.inputs.bump }}"

      - name: Require CLI release notes
        id: notes
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          NOTES_FILE=CLI_RELEASE_NOTES.md
          if [ ! -f "${NOTES_FILE}" ]; then
            echo "::error::missing ${NOTES_FILE}"
            exit 1
          fi
          # Strip a single leading markdown title line; require remaining non-empty content.
          BODY="$(sed '1{/^#/d;}' "${NOTES_FILE}" | sed '/./,$!d')"
          if [ -z "$(echo "${BODY}" | tr -d '[:space:]')" ]; then
            echo "::error::${NOTES_FILE} is empty — add pending CLI notes before publishing"
            exit 1
          fi
          printf '%s\n' "${BODY}" > /tmp/cli-release-body.md
          echo "body_path=/tmp/cli-release-body.md" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: deployment-tool/go.mod
          cache-dependency-path: deployment-tool/go.sum

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Public CLI: Version=semver, Channel=cli (binary updates), KitBranch=Public (stacks).
          # Setup must not preset APP_VERSION from Channel=cli.
          LDFLAGS="-s -w -X eve-industry-planner/deployment-tool/cmd/commands.Version=${VER}"
          LDFLAGS="${LDFLAGS} -X eve-industry-planner/deployment-tool/internal/kit.Channel=cli"
          LDFLAGS="${LDFLAGS} -X eve-industry-planner/deployment-tool/internal/kit.KitBranch=Public"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/eip-windows-amd64.exe .
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/eip-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/eip-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/eip-darwin-arm64 .
          (
            cd dist
            sha256sum eip-windows-amd64.exe eip-linux-amd64 eip-darwin-amd64 eip-darwin-arm64 > SHA256SUMS
          )

      - name: Upload pin Release cli-v*
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          make_latest: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            deployment-tool/dist/eip-windows-amd64.exe
            deployment-tool/dist/eip-linux-amd64
            deployment-tool/dist/eip-darwin-amd64
            deployment-tool/dist/eip-darwin-arm64
            deployment-tool/dist/SHA256SUMS

      - name: Upload floating Release cli
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cli
          name: cli
          body_path: ${{ steps.notes.outputs.body_path }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          make_latest: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            deployment-tool/dist/eip-windows-amd64.exe
            deployment-tool/dist/eip-linux-amd64
            deployment-tool/dist/eip-darwin-amd64
            deployment-tool/dist/eip-darwin-arm64
            deployment-tool/dist/SHA256SUMS

      - name: Clear CLI release notes on Public
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin Public
          git checkout -B Public origin/Public
          printf '%s\n' '# CLI release notes (pending)' '' > CLI_RELEASE_NOTES.md
          git add CLI_RELEASE_NOTES.md
          if git diff --staged --quiet; then
            echo "CLI_RELEASE_NOTES.md already clear"
            exit 0
          fi
          git commit -m "chore(cli): clear CLI_RELEASE_NOTES.md after ${{ steps.version.outputs.tag }}"
          git push origin Public
