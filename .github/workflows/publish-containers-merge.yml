name: Publish containers
on:
    push:
        branches:
            - Public
            - migration
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to build from (must be Public or migration)'
                required: true
                default: 'migration'
                type: choice
                options:
                    - Public
                    - migration

jobs:
    detect_changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            api: ${{ steps.filter.outputs.api }}
            websocket: ${{ steps.filter.outputs.websocket }}
            worker: ${{ steps.filter.outputs.worker }}
            core: ${{ steps.filter.outputs.core }}
            frontend: ${{ steps.filter.outputs.frontend }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.inputs.branch || github.ref || github.ref_name }}
                  # Shallow history breaks merge-base for workflow_dispatch; depth 0 is reliable for paths-filter
                  fetch-depth: 0

            - name: Detect changes
              uses: dorny/paths-filter@v4
              id: filter
              with:
                  # before is empty on workflow_dispatch and can be 000… on new branches — that causes git exit 128.
                  # Push to long-lived branches: same as https://github.com/dorny/paths-filter#examples (base = ref).
                  # Manual run: compare checked-out branch to the repo default branch (paths-filter default behavior).
                  ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}
                  base: ${{ github.event_name == 'push' && github.ref || github.event.repository.default_branch }}
                  filters: |
                      api:
                        - 'services/api/**'
                        - 'services/shared/**'
                        - 'services/go.mod'
                        - 'services/go.sum'
                        - 'VERSION.json'
                      websocket:
                        - 'services/websocket/**'
                        - 'services/shared/**'
                        - 'services/go.mod'
                        - 'services/go.sum'
                        - 'VERSION.json'
                      worker:
                        - 'services/worker/**'
                        - 'services/shared/**'
                        - 'services/go.mod'
                        - 'services/go.sum'
                        - 'VERSION.json'
                      core:
                        - 'services/core/**'
                        - 'services/shared/**'
                        - 'services/go.mod'
                        - 'services/go.sum'
                        - 'VERSION.json'
                      frontend:
                        - 'frontend/**'
                        - 'VERSION.json'

    read_versions:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            frontend: ${{ steps.versions.outputs.frontend }}
            backend: ${{ steps.versions.outputs.backend }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.inputs.branch || github.ref || github.ref_name }}
                  fetch-depth: 1

            - name: Read split versions
              id: versions
              run: |
                  if [ ! -f VERSION.json ]; then
                      echo "::error::VERSION.json is required"
                      exit 1
                  fi

                  FRONTEND_VERSION=$(jq -r '.frontend // empty' VERSION.json)
                  BACKEND_VERSION=$(jq -r '.backend // empty' VERSION.json)

                  if [ -z "${FRONTEND_VERSION}" ] || [ -z "${BACKEND_VERSION}" ]; then
                      echo "::error::VERSION.json must contain frontend and backend fields"
                      exit 1
                  fi

                  if ! echo "${FRONTEND_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
                      echo "::error::Invalid frontend version format: ${FRONTEND_VERSION}"
                      exit 1
                  fi
                  if ! echo "${BACKEND_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
                      echo "::error::Invalid backend version format: ${BACKEND_VERSION}"
                      exit 1
                  fi

                  echo "frontend=${FRONTEND_VERSION}" >> $GITHUB_OUTPUT
                  echo "backend=${BACKEND_VERSION}" >> $GITHUB_OUTPUT

    publish_containers:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [detect_changes, read_versions]
        if: github.event.inputs.branch == 'Public' || github.event.inputs.branch == 'migration' || github.ref_name == 'Public' || github.ref_name == 'migration'
        environment: ${{ (github.event.inputs.branch || github.ref_name) == 'Public' && 'Public' || 'migration' }}
        permissions:
            contents: read
            packages: write

        strategy:
            matrix:
                service: [api, websocket, worker, core, frontend]

        steps:
            - name: Determine branch name
              id: branch-info
              run: |
                  BRANCH_NAME="${{ github.event.inputs.branch || github.ref_name }}"
                  echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
                  echo "Building for branch: ${BRANCH_NAME}"
                  if [ "${BRANCH_NAME}" != "Public" ] && [ "${BRANCH_NAME}" != "migration" ]; then
                      echo "Error: Only Public and migration branches are supported"
                      exit 1
                  fi

            - name: Check if ${{ matrix.service }} should be built
              id: should-build
              run: |
                  SERVICE="${{ matrix.service }}"
                  case "$SERVICE" in
                      api)
                          CHANGED="${{ needs.detect_changes.outputs.api }}"
                          ;;
                      websocket)
                          CHANGED="${{ needs.detect_changes.outputs.websocket }}"
                          ;;
                      worker)
                          CHANGED="${{ needs.detect_changes.outputs.worker }}"
                          ;;
                      core)
                          CHANGED="${{ needs.detect_changes.outputs.core }}"
                          ;;
                      frontend)
                          CHANGED="${{ needs.detect_changes.outputs.frontend }}"
                          ;;
                      *)
                          CHANGED="false"
                          ;;
                  esac
                  if [ "$CHANGED" = "true" ]; then
                      echo "should_build=true" >> $GITHUB_OUTPUT
                      echo "Building $SERVICE - relevant files changed"
                  else
                      echo "should_build=false" >> $GITHUB_OUTPUT
                      echo "Skipping $SERVICE - no relevant files changed"
                  fi

            - name: Checkout repository
              if: steps.should-build.outputs.should_build == 'true'
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.inputs.branch || github.ref || github.ref_name }}
                  fetch-depth: 0
                  fetch-tags: true

            - name: Set up Docker Buildx
              if: steps.should-build.outputs.should_build == 'true'
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              if: steps.should-build.outputs.should_build == 'true'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_TOKEN }}

            - name: Set package name
              if: steps.should-build.outputs.should_build == 'true'
              id: package-name
              run: |
                  # Use repository name with service suffix for better linking
                  # Format: repo-name-service (Docker requires lowercase)
                  REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
                  PACKAGE_NAME="${REPO_NAME}-${{ matrix.service }}"
                  echo "name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
                  echo "Package name: ${PACKAGE_NAME}"
                  echo "Repository: ${{ github.repository }}"
                  echo "Owner: ${{ github.repository_owner }}"

            - name: Determine version
              if: steps.should-build.outputs.should_build == 'true'
              id: version
              run: |
                  if [ "${{ matrix.service }}" == "frontend" ]; then
                      VERSION="${{ needs.read_versions.outputs.frontend }}"
                      echo "Using root frontend version: ${VERSION}"
                  else
                      VERSION="${{ needs.read_versions.outputs.backend }}"
                      echo "Using root backend version: ${VERSION}"
                  fi
                  
                  # Validate version format (should be X.Y.Z)
                  if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
                      echo "Warning: Version '${VERSION}' does not match semantic versioning format (X.Y.Z)"
                  fi
                  
                  # Extract major.minor.patch for semantic versioning
                  MAJOR=$(echo "${VERSION}" | cut -d'.' -f1)
                  MINOR=$(echo "${VERSION}" | cut -d'.' -f2)
                  PATCH=$(echo "${VERSION}" | cut -d'.' -f3)
                  
                  echo "version=${VERSION}" >> $GITHUB_OUTPUT
                  echo "major=${MAJOR}" >> $GITHUB_OUTPUT
                  echo "minor=${MINOR}" >> $GITHUB_OUTPUT
                  echo "patch=${PATCH}" >> $GITHUB_OUTPUT
                  echo "Service: ${{ matrix.service }}"
                  echo "Version: ${VERSION} (${MAJOR}.${MINOR}.${PATCH})"

            - name: Guard against duplicate version tag
              if: steps.should-build.outputs.should_build == 'true'
              run: |
                  IMAGE="ghcr.io/${{ github.repository_owner }}/${{ steps.package-name.outputs.name }}"
                  VERSION_TAG="${{ steps.version.outputs.version }}"
                  BRANCH_TAG="${{ steps.version.outputs.version }}-${{ steps.branch-info.outputs.branch }}"

                  if docker manifest inspect "${IMAGE}:${VERSION_TAG}" > /dev/null 2>&1; then
                      echo "::error::Tag ${IMAGE}:${VERSION_TAG} already exists. Bump version before rebuilding."
                      exit 1
                  fi

                  if docker manifest inspect "${IMAGE}:${BRANCH_TAG}" > /dev/null 2>&1; then
                      echo "::error::Tag ${IMAGE}:${BRANCH_TAG} already exists. Bump version before rebuilding."
                      exit 1
                  fi

            - name: Extract metadata for ${{ matrix.service }}
              if: steps.should-build.outputs.should_build == 'true' && steps.branch-info.outputs.branch != ''
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository_owner }}/${{ steps.package-name.outputs.name }}
                  tags: |
                      type=raw,value=${{ steps.version.outputs.version }}
                      type=raw,value=${{ steps.version.outputs.version }}-${{ steps.branch-info.outputs.branch }}
                      type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}
                      type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
                      type=raw,value=${{ steps.version.outputs.major }}
                      type=raw,value=latest,enable=${{ steps.branch-info.outputs.branch == 'Public' }}
                      type=raw,value=${{ steps.branch-info.outputs.branch }}-latest
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                      org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.event.pull_request.head.repo.updated_at || github.run_started_at }}
                      org.opencontainers.image.url=https://github.com/${{ github.repository }}
                      org.opencontainers.image.title=eve-industry-planner-${{ matrix.service }}
                      org.opencontainers.image.branch=${{ steps.branch-info.outputs.branch }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set build context and dockerfile
              if: steps.should-build.outputs.should_build == 'true'
              id: build-config
              run: |
                  if [ "${{ matrix.service }}" == "frontend" ]; then
                      echo "context=." >> $GITHUB_OUTPUT
                      echo "dockerfile=./frontend/Dockerfile" >> $GITHUB_OUTPUT
                  else
                      echo "context=./services" >> $GITHUB_OUTPUT
                      echo "dockerfile=./services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
                  fi

            # Public branch jobs use GitHub Environment "Public" (see environment: above). DSN can be:
            # - Environment secret SENTRY_DSN → secrets.SENTRY_DSN (your setup)
            # - Optional repo/org variable vars.SENTRY_DSN if you duplicate it as a variable
            # Using only an environment variable named SENTRY_DSN does NOT populate secrets.SENTRY_DSN.
            - name: Verify Sentry DSN for Public builds
              if: steps.should-build.outputs.should_build == 'true' && steps.branch-info.outputs.branch == 'Public'
              env:
                  SENTRY_DSN_VAR: ${{ vars.SENTRY_DSN }}
                  SENTRY_DSN_SECRET: ${{ secrets.SENTRY_DSN }}
              run: |
                  if [ -n "${SENTRY_DSN_VAR}" ] || [ -n "${SENTRY_DSN_SECRET}" ]; then
                    echo "Sentry DSN is configured (variable and/or secret)."
                  else
                    echo "::error::Public builds need SENTRY_DSN. Add secret SENTRY_DSN to the Public environment, or set vars.SENTRY_DSN at repo/org level. Older workflow versions only passed vars.SENTRY_DSN and skipped environment secrets."
                    exit 1
                  fi

            - name: Prepare build args
              if: steps.should-build.outputs.should_build == 'true'
              id: build-args
              env:
                  SENTRY_DSN_VAR: ${{ vars.SENTRY_DSN }}
                  SENTRY_DSN_SECRET: ${{ secrets.SENTRY_DSN }}
              run: |
                  IMAGE_SOURCE="https://github.com/${{ github.repository }}"
                  SENTRY_DSN_VAL="${SENTRY_DSN_VAR}"
                  if [ -z "${SENTRY_DSN_VAL}" ]; then
                    SENTRY_DSN_VAL="${SENTRY_DSN_SECRET}"
                  fi
                  
                  {
                      echo "build-args<<EOF"
                      echo "IMAGE_SOURCE=${IMAGE_SOURCE}"
                      
                      # Frontend needs ENVIRONMENT for build (defaults to production)
                      if [ "${{ matrix.service }}" == "frontend" ]; then
                          if [ "${{ steps.branch-info.outputs.branch }}" == "migration" ]; then
                              ENVIRONMENT="development"
                          else
                              ENVIRONMENT="production"
                          fi
                          echo "ENVIRONMENT=${ENVIRONMENT}"
                          echo "FRONTEND_APP_VERSION=${{ needs.read_versions.outputs.frontend }}"
                          
                          # Sentry: Vite plugin + DSN baked into bundle (same DSN as Go services).
                          # SENTRY_PROJECT_ID must be the project slug from Sentry (e.g. eip-live), not the numeric "Project ID".
                          echo "SENTRY_ORG=${{ vars.SENTRY_ORG }}"
                          echo "SENTRY_PROJECT_ID=${{ vars.SENTRY_PROJECT_ID }}"
                          echo "SENTRY_DSN=${SENTRY_DSN_VAL}"
                          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}"
                          echo "SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE }}"
                          echo "SENTRY_ERROR_SAMPLE_RATE=${{ vars.SENTRY_ERROR_SAMPLE_RATE }}"
                      else
                          # Go services (api, websocket, worker, core): bake Sentry via Dockerfile ARG + go -ldflags -X
                          # (shared/telemetry). Same DSN / branch→ENVIRONMENT convention as the SPA.
                          if [ "${{ steps.branch-info.outputs.branch }}" == "migration" ]; then
                              ENVIRONMENT="development"
                          else
                              ENVIRONMENT="production"
                          fi
                          echo "ENVIRONMENT=${ENVIRONMENT}"
                          echo "SENTRY_DSN=${SENTRY_DSN_VAL}"
                          echo "APP_VERSION=${{ steps.version.outputs.version }}"
                          echo "FRONTEND_APP_VERSION=${{ needs.read_versions.outputs.frontend }}"
                          # Optional: set SENTRY_TRACES_SAMPLE_RATE on the host (.env) for performance traces; omit here → baked empty → 0 unless env set at runtime.
                      fi
                      
                      # API service needs FEEDBACK_DISCORD_WEBHOOK_URL from GitHub variable
                      # Can be overridden at runtime via environment variable
                      if [ "${{ matrix.service }}" == "api" ]; then
                          echo "FEEDBACK_DISCORD_WEBHOOK_URL=${{ vars.FEEDBACK_DISCORD_WEBHOOK_URL }}"
                      fi
                      # API + core: bake feature flags (core exposes core_app_config_* metrics / app-config parity)
                      if [ "${{ matrix.service }}" == "api" ] || [ "${{ matrix.service }}" == "core" ]; then
                          if [ -f VERSION.json ]; then
                              FEATURE_FLAGS_JSON=$(jq -c '.feature_flags // {}' VERSION.json)
                              echo "APP_FEATURE_FLAGS_JSON=${FEATURE_FLAGS_JSON}"
                          else
                              echo "APP_FEATURE_FLAGS_JSON={}"
                          fi
                      fi
                      
                      echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Build and push ${{ matrix.service }} container
              if: steps.should-build.outputs.should_build == 'true'
              uses: docker/build-push-action@v7
              with:
                  context: ${{ steps.build-config.outputs.context }}
                  file: ${{ steps.build-config.outputs.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: ${{ steps.build-args.outputs.build-args }}
              continue-on-error: false

            - name: Set package visibility to public
              if: steps.should-build.outputs.should_build == 'true'
              run: |
                  PACKAGE_NAME="${{ steps.package-name.outputs.name }}"
                  OWNER="${{ github.repository_owner }}"
                  echo "Setting package visibility to public: ${OWNER}/${PACKAGE_NAME}"
                  curl -X PATCH \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/users/${OWNER}/packages/container/${PACKAGE_NAME}" \
                    -d '{"visibility":"public"}' || echo "Warning: Failed to set package visibility. Set manually in GitHub Package settings."
