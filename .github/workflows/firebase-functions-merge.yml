name: Deploy Firebase Functions on merge
on:
  push:
    branches:
      - Main
      - Live
    paths:
      - 'functions/**'
      - 'firebase.json'
  workflow_dispatch:
  
jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'Live' && 'Live' || 'Dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: |
          cd functions
          npm ci

      - name: Install Firebase tools
        run: npm install -g firebase-tools

      - name: Set up cleanup policy
        run: |
          cd functions
          firebase functions:artifacts:setpolicy --days 1 --location europe-west1 --token ${{secrets.FIREBASE_SERVICE_ACCOUNT}} --project ${{secrets.VITE_fbProjectID}}

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --token ${{secrets.FIREBASE_SERVICE_ACCOUNT}} --project ${{secrets.VITE_fbProjectID}} 