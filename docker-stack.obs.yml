  grafana_dashboards_yaml:
    file: ./observability/grafana/provisioning/dashboards/dashboards.yaml
  grafana_dash_api_otel_metrics:
    file: ./observability/grafana/provisioning/dashboards/definitions/api-otel-metrics.json
  grafana_dash_app_activity:
    file: ./observability/grafana/provisioning/dashboards/definitions/app-activity.json
  grafana_dash_asynq_queues:
    file: ./observability/grafana/provisioning/dashboards/definitions/asynq-queues.json
  grafana_dash_core_esi_limits:
    file: ./observability/grafana/provisioning/dashboards/definitions/core-esi-limits.json
  grafana_dash_frontend_events_otel_metrics:
    file: ./observability/grafana/provisioning/dashboards/definitions/frontend-events-otel-metrics.json
  grafana_dash_host:
    file: ./observability/grafana/provisioning/dashboards/definitions/host.json
  grafana_dash_logs_api:
    file: ./observability/grafana/provisioning/dashboards/definitions/logs-api.json
  grafana_dash_logs_core:
    file: ./observability/grafana/provisioning/dashboards/definitions/logs-core.json
  grafana_dash_logs_frontend:
    file: ./observability/grafana/provisioning/dashboards/definitions/logs-frontend.json
  grafana_dash_logs_traefik:
    file: ./observability/grafana/provisioning/dashboards/definitions/logs-traefik.json
  grafana_dash_logs_websocket:
    file: ./observability/grafana/provisioning/dashboards/definitions/logs-websocket.json
  grafana_dash_logs_worker:
    file: ./observability/grafana/provisioning/dashboards/definitions/logs-worker.json
  grafana_dash_mongodb:
    file: ./observability/grafana/provisioning/dashboards/definitions/mongodb.json
  grafana_dash_nats_jetstream:
    file: ./observability/grafana/provisioning/dashboards/definitions/nats-jetstream.json
  grafana_dash_nats_server:
    file: ./observability/grafana/provisioning/dashboards/definitions/nats-server.json
  grafana_dash_observability_stack:
    file: ./observability/grafana/provisioning/dashboards/definitions/observability-stack.json
  grafana_dash_redis:
    file: ./observability/grafana/provisioning/dashboards/definitions/redis.json
  grafana_dash_traefik:
