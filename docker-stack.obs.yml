  grafana_dashboards_yaml:
    file: ./observability/grafana/provisioning/dashboards/dashboards.yaml
  grafana_dash_api_otel_metrics:
    file: ./observability/grafana/provisioning/dashboards/definitions/api-otel-metrics.json
  grafana_dash_app_activity:
