# Operator config (non-secrets). Secrets stay in `.env`.
# Copy to eip.config.yaml (gitignored) and apply with: make swarm-sync

version: 1

addons:
  observability:
    enabled: false

ports:
  http: 80
  https: 443
  traefik_dashboard: 81

paths:
  grafana: /grafana
  traefik_dashboard: /dashboard

# Empty when Traefik is the first public hop. Set only if a CDN/LB in front sets X-Forwarded-*.
proxy:
  trusted_ips: []
  trusted_cidrs: []

scale_timing:
  cooldown: 2m
  scale_up_stabilization: 1m
  scale_down_stabilization: 5m

services:
  worker:
    capacity_controller_managed: true
    min: 1
    max: 2
    concurrency: 50
    scale_up:
      queue_depth: 500
      cooldown: 30s
    scale_down:
      queue_depth: 50
      cooldown: 5m

  websocket:
    capacity_controller_managed: false
    min: 2
    max: 4
    target_clients: 1500
    client_cutoff: 2000
    reserve_capacity: 0.20
    drain_timeout: 10m

  api:
    capacity_controller_managed: false
    min: 1
    max: 6
