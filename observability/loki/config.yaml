# Loki 3.x single-binary / filesystem (see https://grafana.com/docs/loki/latest/configure/ )
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

limits_config:
  allow_structured_metadata: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - compose_service
        - action: drop
          attributes:
            - telemetry.sdk.language
            - telemetry.sdk.name
            - telemetry.sdk.version
            - host.name
    scope_attributes:
      - action: drop
        regex: .*
    log_attributes:
      - action: drop
        attributes:
          - code.filepath
          - code.function
          - code.lineno
          - code.file.path
          - code.function.name
          - code.line.number
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093
