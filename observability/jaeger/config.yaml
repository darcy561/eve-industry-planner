# Jaeger v2 all-in-one: Badger with 7-day span TTL. Paths under /tmp avoid Docker named-volume
# root ownership vs UID 10001 (no init/chown). Trace data survives container restart but not image recreate.
# Default upstream template: https://github.com/jaegertracing/jaeger/blob/v2.17.0/cmd/jaeger/config.yaml
service:
  extensions: [jaeger_storage, jaeger_query, jaeger_mcp, remote_sampling, healthcheckv2, pprof]
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [batch, adaptive_sampling]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:

  pprof:
    endpoint: 0.0.0.0:1777

  jaeger_query:
    storage:
      traces: some_store
      traces_archive: another_store
    max_clock_skew_adjust: 0s

  jaeger_mcp:
    http:
      endpoint: 0.0.0.0:16687

  jaeger_storage:
    backends:
      some_store:
        badger:
          directories:
            keys: /tmp/jaeger/primary
            values: /tmp/jaeger/primary
          ephemeral: false
          ttl:
            spans: 168h
      another_store:
        badger:
          directories:
            keys: /tmp/jaeger/archive
            values: /tmp/jaeger/archive
          ephemeral: false
          ttl:
            spans: 168h

  remote_sampling:
    adaptive:
      sampling_store: some_store
      initial_sampling_probability: 0.1
    http:
    grpc:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  jaeger:
    protocols:
      grpc:
      thrift_binary:
      thrift_compact:
      thrift_http:

  zipkin:

processors:
  batch:
  adaptive_sampling:

exporters:
  jaeger_storage_exporter:
    trace_storage: some_store
