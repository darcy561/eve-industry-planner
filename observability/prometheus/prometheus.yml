# Phase A: infra scrapes. Phase B: Go OTLP metrics → Alloy → Prometheus remote write.
#
# Prometheus reads this file only at process start or after a reload. Editing this file on the host
# does *not* apply until you either:
#   docker compose restart prometheus
#   or:  curl -X POST http://localhost:9090/-/reload   (with Prometheus reachable; lifecycle enabled)
# If you skip this, new scrape jobs (e.g. asynqmon) stay missing and Grafana Asynq queues panels show no data.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Asynqmon: hibiken/asynqmon with --enable-metrics-exporter (queue metrics on /metrics).
  - job_name: asynqmon
    static_configs:
      - targets: ["asynqmon:8080"]
    metrics_path: /metrics

  # NATS: natsio/prometheus-nats-exporter scrapes http://nats:8222 (-m) with -prefix=nats.
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
    metrics_path: /metrics

  # Redis: oliver006/redis_exporter (:9121). namespace label for Grafana Redis dashboard (#763) variables.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          namespace: eip
    metrics_path: /metrics

  # MongoDB: percona/mongodb_exporter (:9216) with --compatible-mode (Grafana #14997).
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
    metrics_path: /metrics

  # Host metrics: prom/node-exporter (:9100).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: /metrics

  # Traefik: native Prometheus metrics on internal entrypoint :8082.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
    metrics_path: /metrics
