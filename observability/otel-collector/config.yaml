# Traces: received on OTLP (apps still export spans) but discarded; use Loki + trace_id in JSON logs for correlation.
# Drops Traefik→Docker Engine API spans (/v1.xx/containers/… ping/version).
# Logs: OTLP LogsService must be served on :4317 or Go apps log "unknown service LogsService". We accept logs
# and write to /dev/null; Loki still ingests JSON from container stdout via Promtail.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/drop_docker_engine_api:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, ".*/v1\\.[0-9]+/")'
  batch: {}

exporters:
  # No trace backend in stack; drop spans cheaply (same pattern as logs → /dev/null).
  file/discard_traces:
    path: /dev/null
  # App OTLP metrics → scrape target for Prometheus (Phase B).
  # Quote the host:port — unquoted 0.0.0.0:8889 can be parsed incorrectly and the exporter never binds.
  prometheus:
    endpoint: "0.0.0.0:8889"
    # Match names in Grafana dashboards (api_*_total, distinct_characters gauges, etc.): no unit/type suffixes.
    # Collector :latest defaults can append suffixes and break provisioned PromQL.
    translation_strategy: UnderscoreEscapingWithoutSuffixes
  file/discard_logs:
    path: /dev/null

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/drop_docker_engine_api, batch]
      exporters: [file/discard_traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/discard_logs]
