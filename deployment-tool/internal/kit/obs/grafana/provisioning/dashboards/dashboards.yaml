apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    # The file is the source of truth and is re-read every updateIntervalSeconds. allowUiUpdates
    # must stay false: with it on, Grafana keeps its own database copy and a changed file no longer
    # reaches the dashboard.
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 15
    allowUiUpdates: false
    options:
      # Swarm configs mount each file under provisioning/ (bytes from eip embed).
      path: /etc/grafana/provisioning/dashboards/definitions
