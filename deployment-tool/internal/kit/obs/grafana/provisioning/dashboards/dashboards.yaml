apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    # Source of truth is Git; file is re-applied every updateIntervalSeconds. allowUiUpdates must be
    # true or Grafana often ignores provisioned auto-refresh (refresh stays Off until you pick 15s).
    disableDeletion: true
    editable: true
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      # Swarm configs mount each file under provisioning/ (bytes from eip embed).
      path: /etc/grafana/provisioning/dashboards/definitions
