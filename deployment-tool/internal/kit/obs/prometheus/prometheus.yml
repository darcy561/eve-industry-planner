# Prometheus scrape config (Swarm data fragment: eip_prometheus on eip-core).
# Always-on lean + exporter targets. Exporters / asynqmon / node_exporter live in
# docker-stack.obs.yml (also dual-homed on eip-core for DNS). Those jobs fail soft
# when the obs addon is not deployed — Prom stays up for app/Traefik scrapes.
#
# App OTLP metrics arrive via Alloy remote_write (job=otel_collector), not scrape.
#
# Reload after edit: hash-diff config sync (`eip sync`), or inside the task:
#   wget -qO- --post-data='' http://localhost:9090/-/reload
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Asynq queues (controller signal). Requires obs fragment (asynqmon on eip-core).
  - job_name: asynqmon
    static_configs:
      - targets: ["asynqmon:8080"]
    metrics_path: /metrics

  # NATS: natsio/prometheus-nats-exporter → http://nats:8222 (-m) with -prefix=nats.
  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]
    metrics_path: /metrics

  # Redis: oliver006/redis_exporter (:9121). namespace for Grafana Redis dashboard (#763).
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          namespace: eip
    metrics_path: /metrics

  # MongoDB: percona/mongodb_exporter (:9216) with --compatible-mode (Grafana #14997).
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
    metrics_path: /metrics

  # Host metrics: prom/node-exporter (:9100). Controller host-headroom later — not #18 v1.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: /metrics

  # Traefik: native Prometheus metrics on internal entrypoint :8082 (eip-core alias).
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
    metrics_path: /metrics
